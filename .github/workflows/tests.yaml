name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm i
      - run: npm run solhint
      # npm test still uses @specron/cli 0.15 / solc 0.6.2. The tree is now
      # mixed 0.6 and 0.8 (Story Protocol). specron cannot compile it. Keep
      # `npm test` for a later Hardhat port; do not fail the license/lint gate.
